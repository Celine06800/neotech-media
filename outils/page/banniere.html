<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face { font-family: Lora; src: url(../linkedin/fonts/lora-latin-500-normal.woff2); font-weight: 500; }

@font-face { font-family: Inter; src: url(../linkedin/fonts/inter-latin-600-normal.woff2); font-weight: 600; }
* { margin: 0; box-sizing: border-box; }
body { width: 1512px; height: 256px; overflow: hidden; background: #0D1B2A; }
.b { position: relative; width: 1512px; height: 256px; overflow: hidden;
  background:
    radial-gradient(520px 300px at 1240px 120px, rgba(201,168,76,.16), transparent 70%),
    radial-gradient(700px 380px at 820px 300px, rgba(46,74,110,.45), transparent 70%),
    linear-gradient(100deg, #0A1522 0%, #0D1B2A 45%, #102338 100%); }
svg.circuit { position: absolute; inset: 0; }
.txt { position: absolute; left: 610px; top: 0; height: 256px; width: 520px; display: flex; flex-direction: column; justify-content: center; }
.k { font: 600 13px/1 Inter; letter-spacing: .26em; text-transform: uppercase; color: #C9A84C; display: flex; align-items: center; gap: 14px; }
.k::before { content: ""; width: 34px; height: 1px; background: #C9A84C; }
h1 { margin-top: 14px; font: 500 46px/1.06 Lora, serif; color: #F5F0E8; letter-spacing: -.005em; }
h1 em { font-style: italic; color: #E8C97A; }
.s { margin-top: 16px; font: 600 15px/1 Inter; letter-spacing: .18em; text-transform: uppercase; color: #C9A84C; }
.s b { font-weight: 600; color: #F5F0E8; }
.s .dot { color: #C9A84C; padding: 0 8px; }
.grain { position: absolute; inset: 0; opacity: .05; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }
</style></head><body>
<div class="b">

      <linearGradient id="g" x1="1" x2="0"><stop offset="0" stop-color="#E8C97A" stop-opacity=".55"/><stop offset="1" stop-color="#C9A84C" stop-opacity="0"/></linearGradient>

  <div class="txt">
